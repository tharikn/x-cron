services:
  postgres:
    image: postgres:16-alpine
    container_name: xcron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xcron
      POSTGRES_PASSWORD: xcron
      POSTGRES_DB: xcron
    ports:
      # Host 5433 avoids clashing with a local Windows Postgres on 5432
      - '5433:5432'
    volumes:
      - xcron_pg:/var/lib/postgresql/data

volumes:
  xcron_pg:
