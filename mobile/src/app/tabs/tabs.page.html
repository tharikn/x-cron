<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="discover" href="/tabs/discover">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>{{ 'nav.discover' | t }}</ion-label>
    </ion-tab-button>
    @if (isAdmin()) {
      <ion-tab-button tab="post" href="/tabs/post">
        <ion-icon name="create-outline"></ion-icon>
        <ion-label>{{ 'nav.post' | t }}</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="ads" href="/tabs/ads">
        <ion-icon name="megaphone-outline"></ion-icon>
        <ion-label>{{ 'nav.ads' | t }}</ion-label>
      </ion-tab-button>
    }
    <ion-tab-button tab="preferences" href="/tabs/preferences">
      <ion-icon name="options-outline"></ion-icon>
      <ion-label>{{ 'nav.prefs' | t }}</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="account" href="/tabs/account">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>{{ 'nav.account' | t }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
