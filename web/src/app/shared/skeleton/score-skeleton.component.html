<div
  class="sk-score"
  role="status"
  aria-busy="true"
  aria-live="polite"
  [attr.aria-label]="label()"
>
  <div class="sk-score__hero" aria-hidden="true">
    <span class="sk sk--meta" style="width: 5rem"></span>
    <span class="sk sk-score__value"></span>
    <span class="sk sk--chip" style="width: 6rem"></span>
    <span class="sk sk--meta" style="width: 8rem"></span>
  </div>
  <div class="sk-score__grid" aria-hidden="true">
    <section class="sk-score__panel">
      <span class="sk sk--title" style="width: 45%"></span>
      <span class="sk sk--text"></span>
      <span class="sk sk--text" style="width: 90%"></span>
      <span class="sk sk--text" style="width: 75%"></span>
    </section>
    <section class="sk-score__panel">
      <span class="sk sk--title" style="width: 40%"></span>
      <span class="sk sk--text"></span>
      <span class="sk sk--text" style="width: 85%"></span>
      <span class="sk sk--text" style="width: 60%"></span>
    </section>
  </div>
  <section class="sk-score__panel" aria-hidden="true">
    <span class="sk sk--title" style="width: 35%"></span>
    @for (_ of [1, 2, 3]; track $index) {
      <div class="sk-score__event">
        <span class="sk sk--text" style="width: 40%"></span>
        <span class="sk sk--meta" style="width: 3rem"></span>
      </div>
    }
  </section>
</div>
