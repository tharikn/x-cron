<article
  class="sk-detail"
  role="status"
  aria-busy="true"
  aria-live="polite"
  [attr.aria-label]="label()"
>
  <p class="sk-detail__crumb" aria-hidden="true">
    <span class="sk sk--meta" style="width: 3rem"></span>
    <span class="sk sk--meta" style="width: 5rem"></span>
  </p>
  <div class="sk-detail__meta" aria-hidden="true">
    <span class="sk sk--chip"></span>
    <span class="sk sk--meta" style="width: 7rem"></span>
  </div>
  <span class="sk sk--title sk-detail__h1" aria-hidden="true"></span>
  <span class="sk sk--text" style="width: 38%" aria-hidden="true"></span>
  <span class="sk sk--text" style="width: 52%" aria-hidden="true"></span>
  <span class="sk sk--text" style="width: 44%" aria-hidden="true"></span>

  <section class="sk-detail__panel" aria-hidden="true">
    <span class="sk sk--title" style="width: 7rem"></span>
    <span class="sk sk--text" style="width: 55%"></span>
    <span class="sk sk--text" style="width: 42%"></span>
    <span class="sk sk--text" style="width: 60%"></span>
  </section>

  <section class="sk-detail__panel" aria-hidden="true">
    <span class="sk sk--title" style="width: 8rem"></span>
    <span class="sk sk--text"></span>
    <span class="sk sk--text" style="width: 94%"></span>
    <span class="sk sk--text" style="width: 86%"></span>
    <span class="sk sk--text" style="width: 70%"></span>
    <span class="sk sk--block" style="height: 4rem; margin-top: 0.35rem"></span>
  </section>

  <section class="sk-detail__panel" aria-hidden="true">
    <span class="sk sk--title" style="width: 9rem"></span>
    <div class="sk-detail__contact">
      <span class="sk sk--chip" style="width: 6rem; height: 2.4rem; border-radius: 10px"></span>
      <span class="sk sk--chip" style="width: 6rem; height: 2.4rem; border-radius: 10px"></span>
      <span class="sk sk--chip" style="width: 6rem; height: 2.4rem; border-radius: 10px"></span>
    </div>
  </section>
</article>
