<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X mark</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #0a0a0a; width: 512px; height: 512px; overflow: hidden; }
    .mark {
      width: 512px;
      height: 512px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f4f4f2;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 300px;
      letter-spacing: 0;
      line-height: 1;
      text-align: center;
    }
    .mark span {
      display: block;
      transform: translateY(-4px);
    }
  </style>
</head>
<body><div class="mark"><span>X</span></div></body>
</html>
