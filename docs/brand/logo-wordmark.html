<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X Cron wordmark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      background: #ffffff;
      width: 1200px;
      height: 420px;
      overflow: hidden;
    }
    .wordmark {
      box-sizing: border-box;
      width: 1200px;
      height: 420px;
      padding: 72px 80px;
      color: #0a0a0a;
    }
    .x {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 168px;
      letter-spacing: -0.06em;
      line-height: 0.95;
      white-space: nowrap;
    }
    .jobs {
      margin: 22px 0 0;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6b6b6b;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="wordmark">
    <p class="x">X Cron</p>
    <p class="jobs">Jobs</p>
  </div>
</body>
</html>
