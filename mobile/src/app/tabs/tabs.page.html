<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="discover" href="/tabs/discover">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>{{ 'nav.discover' | t }}</ion-label>
    </ion-tab-button>
    @if (isEmployer()) {
      <ion-tab-button tab="post" href="/tabs/post">
        <ion-icon name="create-outline"></ion-icon>
        <ion-label>{{ 'nav.post' | t }}</ion-label>
      </ion-tab-button>
    }
    <ion-tab-button
      tab="notifications"
      href="/tabs/notifications"
      [class.tab--hot]="unread() > 0"
    >
      <ion-icon name="notifications-outline"></ion-icon>
      <ion-label>{{ 'nav.notifications' | t }}</ion-label>
      @if (unread() > 0) {
        <ion-badge class="tab-badge">{{ unread() > 99 ? '99+' : unread() }}</ion-badge>
      }
    </ion-tab-button>
    <ion-tab-button tab="settings" href="/tabs/settings">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>{{ 'nav.settings' | t }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
