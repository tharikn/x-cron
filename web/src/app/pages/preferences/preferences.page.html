<section class="page">
  <h1>Preferences</h1>
  <p class="lead">Stored on this device. Sign in with Google to sync across phones.</p>

  <form class="form" (ngSubmit)="save()">
    <label>
      <span>Preferred locations</span>
      <input [(ngModel)]="locationsText" name="locations" placeholder="Palani, Coimbatore" />
    </label>
    <label>
      <span>Categories</span>
      <input [(ngModel)]="categoriesText" name="categories" placeholder="Retail, Delivery" />
    </label>
    <label class="check">
      <input type="checkbox" [(ngModel)]="notifyEmail" name="notifyEmail" />
      <span>Email me when matching jobs appear</span>
    </label>
    <div class="form__actions">
      <button type="submit">Save preferences</button>
      <button type="button" class="btn-clear" (click)="clear()">Clear preferences</button>
    </div>
  </form>

  <section class="channels">
    <h2>Alert channels</h2>
    @if (!isSignedIn()) {
      <p class="hint">Sign in to manage job match, inbox, push, and email alerts.</p>
      <a routerLink="/sign-in" [queryParams]="{ returnUrl: '/preferences' }" class="link">
        Sign in
      </a>
    } @else {
      <label class="check">
        <input
          type="checkbox"
          [ngModel]="notifPrefs().jobAlertsEnabled"
          (ngModelChange)="toggleAlert('jobAlertsEnabled', $event)"
        />
        <span>Job match alerts</span>
      </label>
      <label class="check">
        <input
          type="checkbox"
          [ngModel]="notifPrefs().inAppEnabled"
          (ngModelChange)="toggleAlert('inAppEnabled', $event)"
        />
        <span>In-app inbox</span>
      </label>
      <label class="check">
        <input
          type="checkbox"
          [ngModel]="notifPrefs().pushAlertsEnabled"
          (ngModelChange)="toggleAlert('pushAlertsEnabled', $event)"
        />
        <span>Push (stub / FCM)</span>
      </label>
      <label class="check">
        <input
          type="checkbox"
          [ngModel]="notifPrefs().emailAlertsEnabled"
          (ngModelChange)="toggleAlert('emailAlertsEnabled', $event)"
        />
        <span>Email (stub / SMTP)</span>
      </label>
      <p class="ok">
        Inbox stays on
        <a routerLink="/notifications">Notifications</a>.
      </p>
    }
  </section>

  @if (saved) {
    <p class="ok">Preferences saved.</p>
  }
</section>
