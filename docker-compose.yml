services:
  postgres:
    image: postgres:16-alpine
    container_name: xcron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xcron
      POSTGRES_PASSWORD: xcron
      POSTGRES_DB: xcron
    ports:
      # Host 5433 avoids clashing with a local Windows Postgres on 5432
      - '5433:5432'
    volumes:
      - xcron_pg:/var/lib/postgresql/data

  # Optional: public job cache, BullMQ notification queues, distributed throttle,
  # feedback presence. API stays fully functional with REDIS_URL unset (memory).
  redis:
    image: redis:7-alpine
    container_name: xcron-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    volumes:
      - xcron_redis:/data

volumes:
  xcron_pg:
  xcron_redis:
