<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X Cron mark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600&family=Syne:wght@800&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      background: #0a0a0a;
      width: 512px;
      height: 512px;
      overflow: hidden;
    }
    .mark {
      width: 512px;
      height: 512px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #f4f4f2;
    }
    .x {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 118px;
      letter-spacing: -0.06em;
      line-height: 0.95;
      white-space: nowrap;
    }
    .jobs {
      margin: 14px 0 0;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #bdbdbd;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="mark">
    <div>
      <p class="x">X Cron</p>
      <p class="jobs">Jobs</p>
    </div>
  </div>
</body>
</html>
