@if (open()) {
  <div class="sheet-root" role="presentation" (click)="onBackdrop($event)">
    <div
      class="sheet"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="copy().title"
      (click)="$event.stopPropagation()"
    >
      <div class="sheet__handle" aria-hidden="true"></div>
      <p class="brand">X Cron</p>
      <h2>{{ copy().title }}</h2>
      <p class="body">{{ copy().body }}</p>

      @if (googleReady) {
        <div #googleBtnHost class="google-btn-host" aria-label="Continue with Google"></div>
        <button type="button" class="secondary" [disabled]="busy()" (click)="continueWithGoogle()">
          {{ busy() ? 'Signing in…' : 'Continue with Google' }}
        </button>
      } @else {
        <form class="form" (ngSubmit)="continueWithGoogle()">
          <label>
            <span>Google email</span>
            <input
              type="email"
              [(ngModel)]="email"
              name="sheetEmail"
              placeholder="you@gmail.com"
              required
              autocomplete="username"
            />
          </label>
          <label>
            <span>Display name (optional)</span>
            <input [(ngModel)]="displayName" name="sheetDisplayName" placeholder="Your name" />
          </label>
          <button type="submit" [disabled]="busy()">
            {{ busy() ? 'Signing in…' : 'Continue with Google' }}
          </button>
        </form>
      }

      <button type="button" class="ghost" [disabled]="busy()" (click)="dismiss()">Not now</button>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
    </div>
  </div>
}
