<div class="scroll-arrows" role="group" aria-label="Page scroll controls">
  @if (canScrollUp()) {
    <button
      type="button"
      class="scroll-arrows__btn"
      aria-label="Back to top"
      title="Back to top"
      (click)="scrollToTop()"
    >
      <svg class="scroll-arrows__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M12 19V5m0 0-6 6m6-6 6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  }

  @if (canScrollDown()) {
    <button
      type="button"
      class="scroll-arrows__btn"
      aria-label="Scroll to bottom"
      title="Scroll to bottom"
      (click)="scrollToBottom()"
    >
      <svg class="scroll-arrows__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="M12 5v14m0 0 6-6m-6 6-6-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  }
</div>
