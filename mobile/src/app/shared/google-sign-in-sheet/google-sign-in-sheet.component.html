<ion-modal
  [isOpen]="open()"
  [initialBreakpoint]="0.55"
  [breakpoints]="[0, 0.55, 0.8]"
  handle="true"
  (didDismiss)="dismiss()"
>
  <ng-template>
    <ion-content class="sheet-content">
      <div class="sheet">
        <p class="brand">X Cron</p>
        <h2>{{ copy().title }}</h2>
        <p class="body">{{ copy().body }}</p>

        <div class="auth-tabs">
          <ion-button
            size="small"
            [fill]="formMode() === 'login' ? 'solid' : 'outline'"
            color="dark"
            (click)="setFormMode('login')"
          >
            Sign in
          </ion-button>
          <ion-button
            size="small"
            [fill]="formMode() === 'register' ? 'solid' : 'outline'"
            color="dark"
            (click)="setFormMode('register')"
          >
            Create account
          </ion-button>
        </div>

        <ion-item lines="full" class="field">
          <ion-input
            label="Username"
            labelPlacement="stacked"
            type="text"
            [(ngModel)]="username"
            placeholder="Enter Username"
            autocomplete="username"
            minlength="3"
            maxlength="32"
          ></ion-input>
        </ion-item>
        <ion-item lines="full" class="field">
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            [autocomplete]="formMode() === 'register' ? 'new-password' : 'current-password'"
            minlength="8"
          ></ion-input>
        </ion-item>
        @if (formMode() === 'register') {
          <ion-item lines="full" class="field">
            <ion-input
              label="Confirm password"
              labelPlacement="stacked"
              type="password"
              [(ngModel)]="confirmPassword"
              placeholder="••••••••"
              autocomplete="new-password"
              minlength="8"
            ></ion-input>
          </ion-item>
        }

        <ion-button
          expand="block"
          color="dark"
          class="google-btn"
          [disabled]="busy()"
          (click)="submit()"
        >
          @if (busy()) {
            Working…
          } @else {
            {{ formMode() === 'register' ? 'Create account' : 'Sign in' }}
          }
        </ion-button>

        <ion-button expand="block" fill="clear" color="dark" [disabled]="busy()" (click)="dismiss()">
          Not now
        </ion-button>

      </div>
    </ion-content>
  </ng-template>
</ion-modal>
