<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>X Cron logo export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600;9..40,700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body { display: grid; gap: 48px; padding: 48px; font-synthesis: none; }
    .wordmark {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      width: max-content;
      color: #0a0a0a;
    }
    .wordmark__x {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 168px;
      letter-spacing: -0.06em;
      line-height: 0.95;
      white-space: nowrap;
    }
    .wordmark__jobs {
      margin: 18px 0 0;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6b6b6b;
      line-height: 1;
    }
    .favicon {
      width: 512px;
      height: 512px;
      border-radius: 112px;
      background: #0a0a0a;
      color: #f4f4f2;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 36px;
    }
    .favicon__x {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 220px;
      letter-spacing: -0.08em;
      line-height: 0.9;
      text-align: center;
    }
    .favicon__jobs {
      margin: 10px 0 0;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      font-size: 42px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #bdbdbd;
      text-align: center;
    }
    .light-mark {
      width: 512px;
      height: 512px;
      border-radius: 112px;
      background: #f4f4f2;
      color: #0a0a0a;
      border: 2px solid #e4e4e0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 36px;
    }
    .light-mark .favicon__jobs { color: #6b6b6b; }
  </style>
</head>
<body>
  <div id="wordmark" class="wordmark">
    <p class="wordmark__x">X Cron</p>
    <p class="wordmark__jobs">Jobs</p>
  </div>
  <div id="favicon" class="favicon">
    <div>
      <p class="favicon__x">X Cron</p>
      <p class="favicon__jobs">Jobs</p>
    </div>
  </div>
  <div id="mark-light" class="light-mark">
    <div>
      <p class="favicon__x">X Cron</p>
      <p class="favicon__jobs">Jobs</p>
    </div>
  </div>
</body>
</html>
