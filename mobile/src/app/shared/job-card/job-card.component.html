<ion-card [routerLink]="['/tabs/jobs', job.id]" button="true" class="job-card">
  <ion-card-header>
    <div class="job-card__meta">
      <ion-badge color="medium">{{ languageLabel(job.contentLanguage) }}</ion-badge>
      <ion-text color="medium">
        <small>{{ formatPostedDate(job.publishedAt) }}</small>
      </ion-text>
    </div>
    <ion-card-title>{{ job.title }}</ion-card-title>
    <ion-card-subtitle>
      {{ job.employerName }}
      @if (job.verifiedEmployer) {
        · Verified
      }
    </ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <p class="job-card__line">{{ formatLocation(job) }}</p>
    <p class="job-card__line">{{ formatJobType(job) }} · {{ formatSalary(job.salary) }}</p>
    <p class="job-card__about">{{ job.description.about }}</p>
  </ion-card-content>
</ion-card>
