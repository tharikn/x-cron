<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme demo 4 — Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f4ef;
        --card: #fffcf8;
        --ink: #14121a;
        --muted: #6f6a63;
        --navy: #1a2744;
        --primary: #1a2744;
        --cta: #b8892d;
        --cta-hover: #9a7224;
        --accent: #d4af57;
        --wash: #efe8db;
        --line: #e4dccf;
        --radius: 14px;
        --font-display: 'Cormorant Garamond', Georgia, serif;
        --font-body: Manrope, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(900px 420px at 12% -8%, rgba(212, 175, 87, 0.22) 0%, transparent 55%),
          radial-gradient(700px 360px at 100% 0%, rgba(26, 39, 68, 0.08) 0%, transparent 50%),
          linear-gradient(180deg, #faf7f2 0%, var(--bg) 45%, #f3efe8 100%);
      }
      .wrap {
        max-width: 440px;
        margin: 0 auto;
        padding: 28px 18px 48px;
      }
      .tag {
        display: inline-block;
        margin-bottom: 12px;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(255, 252, 248, 0.9);
        border: 1px solid var(--line);
        color: var(--cta);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .brand {
        margin: 0;
        font-family: var(--font-display);
        font-size: 3.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 0.92;
        color: var(--navy);
      }
      .jobs {
        margin: 0.4rem 0 1.15rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--cta);
      }
      h1 {
        margin: 0 0 0.55rem;
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--navy);
      }
      .lead {
        margin: 0 0 1.35rem;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.98rem;
      }
      .search {
        display: grid;
        gap: 0.7rem;
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.8) inset,
          0 16px 36px rgba(26, 39, 68, 0.08);
        margin-bottom: 1.3rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--wash);
        border-radius: 11px;
        padding: 0.85rem 0.9rem;
        font: inherit;
        color: var(--ink);
      }
      .btn {
        border: 0;
        border-radius: 11px;
        min-height: 46px;
        background: linear-gradient(180deg, #c99a3a 0%, var(--cta) 55%, var(--cta-hover) 100%);
        color: #fffaf0;
        font-weight: 700;
        font-family: inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(184, 137, 45, 0.28);
      }
      .btn:hover {
        filter: brightness(1.04);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 1.05rem;
        margin-bottom: 0.8rem;
        box-shadow: 0 10px 24px rgba(26, 39, 68, 0.05);
      }
      .card h2 {
        margin: 0 0 0.3rem;
        font-size: 1.2rem;
        font-family: var(--font-display);
        font-weight: 700;
        color: var(--navy);
      }
      .card p {
        margin: 0 0 0.8rem;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .meta {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      .chip {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.28rem 0.55rem;
        border-radius: 999px;
        background: #eef1f7;
        color: var(--navy);
      }
      .chip--accent {
        background: linear-gradient(180deg, #f4e6c4, #efe0b4);
        color: #7a5a18;
        border: 1px solid rgba(184, 137, 45, 0.25);
      }
      .link {
        color: var(--cta);
        font-weight: 700;
        text-decoration: none;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="tag">Demo 4 / 4 · Premium</span>
      <p class="brand">X Cron</p>
      <p class="jobs">Jobs</p>
      <h1>Find work near you</h1>
      <p class="lead">Local roles with clear pay, city filters, and unlock when you’re ready.</p>
      <form class="search" onsubmit="return false">
        <label>Role<input value="Warehouse helper" /></label>
        <label>Location<input value="Palani" /></label>
        <button class="btn" type="button">Search roles</button>
      </form>
      <article class="card">
        <div class="meta">
          <span class="chip">Full-time</span>
          <span class="chip chip--accent">Featured</span>
        </div>
        <h2>Warehouse helper</h2>
        <p>Sunrise Logistics · ₹16k–18k · Palani</p>
        <a class="link" href="#">View role →</a>
      </article>
      <article class="card">
        <div class="meta"><span class="chip">Part-time</span></div>
        <h2>Cafe cashier</h2>
        <p>Bean Street · ₹12k · Dindigul</p>
        <a class="link" href="#">View role →</a>
      </article>
    </div>
  </body>
</html>
