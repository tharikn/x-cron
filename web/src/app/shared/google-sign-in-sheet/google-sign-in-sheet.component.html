@if (open()) {
  <div class="sheet-root" role="presentation" (click)="onBackdrop($event)">
    <div
      class="sheet"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="copy().title"
      (click)="$event.stopPropagation()"
    >
      <div class="sheet__handle" aria-hidden="true"></div>
      <p class="brand">X Cron</p>
      <h2>{{ copy().title }}</h2>
      <p class="body">{{ copy().body }}</p>

      <div class="mode-tabs" role="tablist" aria-label="Account form">
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="formMode() === 'login'"
          [class.active]="formMode() === 'login'"
          (click)="setFormMode('login')"
        >
          Sign in
        </button>
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="formMode() === 'register'"
          [class.active]="formMode() === 'register'"
          (click)="setFormMode('register')"
        >
          Create account
        </button>
      </div>

      <form class="form" (ngSubmit)="submit()">
        <label>
          <span>Username</span>
          <input
            type="text"
            [(ngModel)]="username"
            name="sheetUsername"
            placeholder="Enter Username"
            required
            minlength="3"
            maxlength="32"
            autocomplete="username"
          />
        </label>
        <label>
          <span>Password</span>
          <input
            type="password"
            [(ngModel)]="password"
            name="sheetPassword"
            placeholder="••••••••"
            required
            minlength="8"
            [attr.autocomplete]="formMode() === 'register' ? 'new-password' : 'current-password'"
          />
        </label>
        @if (formMode() === 'register') {
          <label>
            <span>Confirm password</span>
            <input
              type="password"
              [(ngModel)]="confirmPassword"
              name="sheetConfirmPassword"
              placeholder="••••••••"
              required
              minlength="8"
              autocomplete="new-password"
            />
          </label>
        }
        <button type="submit" [disabled]="busy()">
          @if (busy()) {
            Working…
          } @else {
            {{ formMode() === 'register' ? 'Create account' : 'Sign in' }}
          }
        </button>
      </form>

      <button type="button" class="ghost" [disabled]="busy()" (click)="dismiss()">Not now</button>
    </div>
  </div>
}
