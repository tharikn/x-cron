@if (busy()) {
  <div
    class="api-loading"
    role="status"
    aria-live="polite"
    aria-busy="true"
    aria-label="Loading"
  >
    <app-api-loading-skeleton />
  </div>
}
<ion-app>
  <ion-router-outlet></ion-router-outlet>
  <app-help-chat />
  @if (themePromptOpen()) {
    <app-theme-prompt (closed)="onThemePromptClosed()" />
  }
</ion-app>
