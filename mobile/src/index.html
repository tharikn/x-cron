<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X Cron</title>

    <base href="/" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070412" />
    <meta
      name="description"
      content="X Cron Jobs — local-first, multilingual job discovery for India."
    />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600&family=Outfit:wght@600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>

  <body>
    <!-- Shown until Angular boots; removed by AppComponent. -->
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading X Cron">
      <img
        class="boot-splash__logo"
        src="assets/icon/xcron-logo-mark-square.png"
        alt="X Cron Jobs"
        width="128"
        height="128"
      />
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        margin: 0;
        background: #070412;
        transition: opacity 0.28s ease;
      }
      #boot-splash.boot-splash--done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__logo {
        width: min(42vw, 128px);
        height: auto;
        border-radius: 22px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        animation: boot-splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-splash-pulse {
        0%,
        100% {
          opacity: 1;
          transform: translateY(0);
        }
        50% {
          opacity: 0.72;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__logo {
          animation: none;
        }
        #boot-splash {
          transition: none;
        }
      }
    </style>
    <app-root></app-root>
  </body>
</html>
